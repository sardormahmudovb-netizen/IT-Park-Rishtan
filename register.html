<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ro‘yxatdan o‘tish — IT Park Rishton</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eaf2ff,#ffffff);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 15px;
}

.form-card{
    width:100%;
    max-width:650px;
    background:white;
    padding:40px;
    border-radius:28px;
    box-shadow:0 15px 50px rgba(0,0,0,.1);
}

.back{
    display:inline-block;
    text-decoration:none;
    color:#1769ff;
    font-weight:bold;
    margin-bottom:25px;
}

h1{
    font-size:35px;
    margin-bottom:10px;
}

.description{
    color:#6b7280;
    line-height:1.6;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:15px;
    border:1px solid #d7deea;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

input:focus,
select:focus{
    border-color:#1769ff;
}

.submit{
    width:100%;
    border:0;
    padding:16px;
    border-radius:13px;
    background:#1769ff;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.submit:hover{
    background:#0958e8;
}

.success{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#e8fff0;
    color:#15803d;
    border-radius:12px;
    text-align:center;
}

@media(max-width:600px){
    .form-card{
        padding:25px;
    }

    h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="form-card">

<a href="index.html" class="back">← Bosh sahifaga qaytish</a>

<h1>Ro‘yxatdan o‘tish 📝</h1>

<p class="description">
IT Park Rishton kurslariga qatnashish uchun ma’lumotlaringizni kiriting.
</p>

<form id="registerForm">

<div class="form-group">
<label>Ism</label>
<input type="text" placeholder="Ismingizni kiriting" required>
</div>

<div class="form-group">
<label>Familiya</label>
<input type="text" placeholder="Familiyangizni kiriting" required>
</div>

<div class="form-group">
<label>Telefon raqam</label>
<input type="tel" placeholder="+998 XX XXX XX XX" required>
</div>

<div class="form-group">
<label>Ota-onangizning ismi</label>
<input type="text" placeholder="Ota yoki onangizning ismini kiriting" required>
</div>

<div class="form-group">
<label>Yoshingiz</label>
<input type="number" min="5" max="100" placeholder="Yoshingizni kiriting" required>
</div>

<div class="form-group">
<label>Qaysi kursga qatnashasiz?</label>

<select required>
<option value="">Kursni tanlang</option>
<option>Frontend</option>
<option>Python</option>
<option>Sun’iy intellekt</option>
<option>Grafik dizayn</option>
</select>

</div>

<button class="submit" type="submit">
Ro‘yxatdan o‘tish
</button>

<div class="success" id="success">
✅ Ro‘yxatdan o‘tish muvaffaqiyatli yakunlandi!
</div>

</form>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit",function(e){

    e.preventDefault();

    document.getElementById("success").style.display="block";

    this.reset();

});
</script>

</body>
</html>
